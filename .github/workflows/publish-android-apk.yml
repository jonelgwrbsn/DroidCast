name: Publish Android APK

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - .github/workflows/publish-android-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Create debug signing key
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Android APK
        run: gradle :app:assembleDebug

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk DroidCast.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: android-${{ github.run_number }}
          name: DroidCast Android build ${{ github.run_number }}
          body: >-
            Automatically built Android debug APK. Install from this release.
            Because this build uses a temporary CI signing key, uninstall an
            older CI build before installing a newer one if Android reports a
            signature conflict.
          files: DroidCast.apk
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
